[package]
name = "crawler-control-extension-rs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "W Protocol extension shell for crawler-control"

[lib]
crate-type = ["cdylib"]

[dependencies]
crawler-control-rs = { path = "../crawler-control-rs" }
crawler-fetch-rs = { path = "../crawler-fetch-rs" }
crawler-indexer-rs = { path = "../crawler-indexer-rs" }
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.36"

[package.metadata.component]
package = "etzhayyim:w"
target = { world = "w-extension" }
