[package]
name = "crawler-control-http-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
crawler-control-rs = { path = "vendor/crawler-control-rs" }
crawler-fetch-rs = { path = "vendor/crawler-fetch-rs" }
crawler-indexer-rs = { path = "vendor/crawler-indexer-rs" }
indexmap = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
